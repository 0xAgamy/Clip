<!-- Clips List -->
<div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">

  @for (video of Videos; track video.id) {
    <a [routerLink]="['clip',video.id]"
      class="group surface-card overflow-hidden transition duration-300 hover:-translate-y-1 hover:shadow-2xl hover:shadow-black/40 hover:ring-indigo-400/30">

      <!-- Thumbnail -->
      <div class="relative aspect-video overflow-hidden bg-[#1b2437]">
        <img class="h-full w-full object-cover transition duration-500 group-hover:scale-105"
          [src]="video.thumbnailUrl" [alt]="video.title">
        <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/0 to-black/0"></div>
        <span class="absolute left-1/2 top-1/2 flex h-14 w-14 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full bg-white/20 text-white opacity-0 backdrop-blur transition duration-300 group-hover:opacity-100">
          <span class="material-icons">play_arrow</span>
        </span>
      </div>

      <!-- Body -->
      <div class="p-5">
        <h2 class="line-clamp-2 text-lg font-semibold text-white transition-colors duration-200 group-hover:text-indigo-300">
          {{video.title}}
        </h2>
        <p class="mt-3 flex flex-wrap items-center gap-x-2 gap-y-1 text-sm text-gray-400">
          <span class="material-icons text-base">person</span>
          <span class="text-gray-300">{{ video.userName }}</span>
          <span class="text-gray-600">&middot;</span>
          <span>{{video.created | date:'longDate'}}</span>
        </p>
      </div>
    </a>
  }

</div>
