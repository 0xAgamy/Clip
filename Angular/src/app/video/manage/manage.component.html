<section class="page-container py-8">

  <!-- Top Bar -->
  <div class="surface-card mb-8 flex flex-col gap-4 p-6 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h1 class="section-title">Manage videos</h1>
      <p class="muted mt-1 text-sm">Upload, edit and remove your clips.</p>
    </div>
    <a routerLink="/upload" class="btn btn-primary">
      <span class="material-icons text-base">cloud_upload</span>
      Upload video
    </a>
  </div>

  <!-- User's Video Section -->
  @if (UserVideos.length) {
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (video of UserVideos; track video) {
        <div class="surface-card flex flex-col overflow-hidden transition duration-300 hover:-translate-y-1 hover:shadow-2xl hover:shadow-black/40">

          <!-- Thumbnail -->
          <a [routerLink]="['/clip',video.id]" class="group relative block aspect-video overflow-hidden bg-[#1b2437]">
            <img class="h-full w-full object-cover transition duration-500 group-hover:scale-105"
              [src]="video.thumbnailUrl" [alt]="video.title">
            <span class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/0 to-black/0 opacity-0 transition duration-300 group-hover:opacity-100"></span>
          </a>

          <!-- Body -->
          <div class="p-5">
            <h2 class="line-clamp-2 text-lg font-semibold text-white">{{video.title}}</h2>
          </div>

          <!-- Actions -->
          <div class="mt-auto flex divide-x divide-white/5 border-t border-white/5 bg-black/20">
            <a [routerLink]="['/edit',video.id]"
              class="flex flex-1 items-center justify-center gap-2 py-3 text-sm font-medium text-gray-300 transition hover:bg-white/5 hover:text-indigo-300">
              <span class="material-icons text-base">build</span>
              Edit
            </a>
            <button type="button" (click)="DeleteVideo(video.id)"
              class="flex flex-1 items-center justify-center gap-2 py-3 text-sm font-medium text-gray-300 transition hover:bg-red-500/10 hover:text-red-400">
              <span class="material-icons text-base">delete</span>
              Delete
            </button>
          </div>
        </div>
      }
    </div>
  } @else {
    <!-- Empty State -->
    <div class="surface-card flex flex-col items-center justify-center px-6 py-16 text-center">
      <span class="material-icons mb-4 text-5xl text-gray-500">video_library</span>
      <h2 class="text-xl font-semibold text-white">No videos yet</h2>
      <p class="muted mt-2 max-w-sm text-sm">Upload your first clip and it will show up here.</p>
      <a routerLink="/upload" class="btn btn-primary mt-6">Upload a video</a>
    </div>
  }

</section>
